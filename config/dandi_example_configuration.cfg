# dandi example configuration
# pyqtgraph configfile format

# for datasets included in this configuration:
datasets:
    "my_first_dataset_id": "000000"
    "my_last_dataset_id": "999999"

# for each dataset, include the following information (this is just an example):
DCN_IC_inj:
    dataset_id: "001423"
    keywords: [ "mouse", "intracellular recording", "channelrhodopsins", "pathway tracing", "auditory cortex", "auditory thalamus", "medial geniculate", "inferior colliculus", "brachium of the inferior colliculus", "cochlear nucleus", "dorsal cochlear nucleus", "AAV", "synaptic potentials", "optogenetics", ]
    experimenters: ["Princess Leia", "Darth Vader", "Luke Skywalker", "Han Solo", "Chewbacca", "R2D2", "C3PO", "JRandomTroll"]
    grants: "R01NS000000, RF1DC999999, P50DC888888"
    experiment_description: "Recording in Jabba's brain after various injections of retrograde tracers in the olfactory bulb"
    iacuc_protocols: "72-0194a, 72-0194b, 72-0194c"
    device: "MultiClamp1.ma"  # acq4 amplifier designation in the rig
    mode:"CC"  # current clamp or voltage clamp (this should actually be set from the data itself)
    configfile: "ephys_configuration_file_/config/experiments.cfg"  # just used for the "exclusions", but you could rewrite to have those here as well. 

#   (Repeat the above structure for additional datasets.)
